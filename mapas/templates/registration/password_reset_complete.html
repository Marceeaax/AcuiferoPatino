<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contraseña actualizada</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #11998e, #38ef7d);
      padding: 24px;
      box-sizing: border-box;
    }
    .box {
      width: min(430px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 2rem 2.25rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.14);
      text-align: center;
    }
    h2 { margin: 0 0 .8rem; color: #11998e; }
    p { color: #475569; line-height: 1.55; }
    a { color: #11998e; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Contraseña actualizada</h2>
    <p>Tu contraseña fue cambiada correctamente. Ya podés volver a iniciar sesión.</p>
    <a href="{% url 'login' %}">Ir al inicio de sesión</a>
  </div>
</body>
</html>

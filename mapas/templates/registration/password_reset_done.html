<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Correo enviado</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #11998e, #38ef7d);
      padding: 24px;
      box-sizing: border-box;
    }
    .box {
      width: min(430px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 2rem 2.25rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.14);
    }
    h2 { margin: 0 0 .8rem; color: #11998e; text-align: center; }
    p { color: #475569; line-height: 1.55; }
    .links { margin-top: 18px; text-align: center; }
    .links a { color: #11998e; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Revisá tu correo</h2>
    <p>Si existe una cuenta asociada al correo ingresado, enviamos un enlace para restablecer la contraseña.</p>
    <p>Si no lo ves enseguida, revisá también la carpeta de spam o promociones.</p>
    <div class="links">
      <a href="{% url 'login' %}">Volver al inicio de sesión</a>
    </div>
  </div>
</body>
</html>

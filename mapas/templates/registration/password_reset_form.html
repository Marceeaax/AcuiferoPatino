<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar contraseña</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #11998e, #38ef7d);
      padding: 24px;
      box-sizing: border-box;
    }
    .box {
      width: min(430px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 2rem 2.25rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.14);
    }
    h2 { margin: 0 0 .6rem; color: #11998e; text-align: center; }
    p { color: #475569; line-height: 1.5; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input[type="email"] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 11px 12px;
      font-size: 1rem;
      margin-bottom: 14px;
    }
    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #38ef7d;
      color: #fff;
      padding: 11px 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .submit-btn:hover { background: #2fdc6a; }
    .links { margin-top: 14px; text-align: center; }
    .links a { color: #11998e; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .errorlist { color: #b91c1c; font-size: .9rem; padding-left: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>¿Olvidaste tu contraseña?</h2>
    <p>Ingresá tu correo y te enviaremos un enlace para definir una nueva contraseña.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label for="{{ form.email.id_for_label }}">Correo electrónico</label>
      {{ form.email }}
      {{ form.email.errors }}
      <button type="submit" class="submit-btn">Enviar enlace</button>
    </form>
    <div class="links">
      <a href="{% url 'login' %}">Volver a iniciar sesión</a>
    </div>
  </div>
</body>
</html>
